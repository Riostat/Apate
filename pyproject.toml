[project]
name = "apate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "rich>=15.0.0",
]

[project.scripts]
apate = "apate:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "logger>=0.4.9.6",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.lint]
ignore = ["I001", "FURB105", "E722"]
